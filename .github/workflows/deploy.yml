name: Build Deploy Verify Sentiment Analysis Streamlit

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/sentiment-analysis-sih
  EC2_INSTANCE_ID: i-02574bb763416d442
  CONTAINER_PORT: "8501"
  HOST_PORT: "80"
  PUBLIC_URL: http://43.204.71.54
  HEALTH_PATH: /_stcore/health
  SECRETS_MANAGER_ID: deptic/Sentiment_analysis_sih/secrets

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repository and requirements diagnostics
        run: |
          set -euo pipefail
          echo "--- repo tree ---"
          ls -la
          echo "--- src ---"
          ls -la src || true
          echo "--- models ---"
          ls -la models || true
          echo "--- requirements.txt ---"
          cat requirements.txt
          echo "--- entrypoint check ---"
          test -f app.py && echo "app.py present"
          test -f Dockerfile && echo "Dockerfile present"
          test -f models/sentiment_model.pkl && echo "sentiment_model.pkl present"
          grep -n "streamlit" requirements.txt || true
          grep -n "8501" Dockerfile || true
          python --version
          python -m pip --version

      - name: Validate Python source syntax
        run: |
          set -euo pipefail
          python -m py_compile app.py src/data_loader.py src/preprocessor.py src/trainer.py src/visuals.py
          echo "python syntax OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::6}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:${IMAGE_TAG}"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE=${LATEST_IMAGE}" >> "$GITHUB_ENV"

      - name: Authenticate Docker to ECR (direct AWS CLI, static credentials)
        run: |
          set -euo pipefail
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (repository Dockerfile, context .)
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t "$FULL_IMAGE" -t "$LATEST_IMAGE" .
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep "$ECR_REPOSITORY_URI" || true

      - name: Push Docker image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE"
          docker push "$LATEST_IMAGE"

  deploy:
    name: Deploy to EC2 via SSM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deployment image URI
        run: |
          set -euo pipefail
          IMAGE_URI="${{ needs.build.outputs.image_uri }}"
          if [ -z "$IMAGE_URI" ]; then
            IMAGE_URI="$ECR_REPOSITORY_URI:latest"
          fi
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Deploying image: ${IMAGE_URI}"

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=${IMAGE_URI}",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:8501 $IMAGE_URI",
              "docker ps --format '{{.Names}} {{.Status}}' | grep app || true",
              "docker image prune -f || true"
            ]
          }
          SSMPARAMS
          envsubst_unused=1 || true
          python - << 'PYEOF'
          import os, json
          with open('/tmp/ssm-params.json') as f:
              payload = json.load(f)
          payload["commands"] = [c.replace("${IMAGE_URI}", os.environ["IMAGE_URI"]) for c in payload["commands"]]
          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump(payload, f, indent=2)
          print("SSM payload written with IMAGE_URI baked in")
          PYEOF

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"
          echo "Sent SSM command: ${COMMAND_ID}"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" --output text)
          echo "SSM command status: ${STATUS}"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" --output text || true
          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed with status ${STATUS}"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" --output text || true
            exit 1
          fi

  verify:
    name: Verify Public Health Endpoint
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for container startup grace period
        run: sleep 20

      - name: Health check public URL (must return HTTP 200)
        run: |
          set -euo pipefail
          HEALTH_URL="${PUBLIC_URL}${HEALTH_PATH}"
          echo "Checking ${HEALTH_URL}"
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            echo "Attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from ${HEALTH_URL}"
          exit 1

      - name: Deployment summary
        run: |
          set -euo pipefail
          echo "Deployment verified:"
          echo "  public_url   = ${PUBLIC_URL}"
          echo "  health_path  = ${HEALTH_PATH}"
          echo "  instance_id  = ${EC2_INSTANCE_ID}"
          echo "  ecr_repo     = ${ECR_REPOSITORY_URI}"
          echo "  container    = ${CONTAINER_PORT} -> host ${HOST_PORT}"