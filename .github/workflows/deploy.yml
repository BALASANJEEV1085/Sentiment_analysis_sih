name: build-deploy-verify-sentiment-analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/sentiment-analysis-sih
  EC2_INSTANCE_ID: i-05a2563eed9aff4e0
  PUBLIC_URL: http://43.204.71.54
  CONTAINER_PORT: "8501"
  SECRETS_MANAGER_ID: deptic/Sentiment_analysis_sih/secrets

jobs:
  build:
    name: Build, Diagnostics and Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies from requirements.txt
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build diagnostics - compile all Python sources
        run: |
          set -euo pipefail
          python -m py_compile app.py src/data_loader.py src/preprocessor.py src/trainer.py src/visuals.py
          python -m compileall -q app.py src
          ls -la app.py requirements.txt Dockerfile models/sentiment_model.pkl src/

      - name: Build diagnostics - import smoke test (modules only)
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import importlib
          for mod in ("src.data_loader", "src.preprocessor", "src.trainer", "src.visuals"):
              importlib.import_module(mod)
              print("OK import", mod)
          from src.trainer import vader_sentiment_label, vader_sentiment_score
          print("VADER score:", vader_sentiment_score("I love this product"))
          print("VADER label:", vader_sentiment_label("this is terrible"))
          PYEOF

      - name: Build diagnostics - model artifact load check
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import pickle
          with open("models/sentiment_model.pkl", "rb") as f:
              pipe = pickle.load(f)
          print("Model loaded:", type(pipe))
          print("Steps:", [name for name, _ in pipe.steps])
          preds = pipe.predict(["I love it", "I hate it", "it is okay"])
          print("Sample predictions:", list(preds))
          PYEOF

      - name: Build diagnostics - streamlit headless boot probe
        run: |
          set -euo pipefail
          timeout 90 streamlit run app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 &
          SPID=$!
          BOOT_OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8501/_stcore/health || true)
            if [ "$CODE" = "200" ]; then echo "Streamlit boot probe OK (HTTP 200)"; BOOT_OK=1; break; fi
            sleep 2
          done
          kill $SPID 2>/dev/null || true
          wait $SPID 2>/dev/null || true
          if [ "$BOOT_OK" != "1" ]; then echo "Boot probe failed: no HTTP 200 from /_stcore/health"; exit 1; fi
          echo "Boot probe finished"

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ID}"
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Image: ${IMAGE_URI}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (production image, no push yet)
        run: |
          set -euo pipefail
          docker build -t "${IMAGE_URI}" -t "${ECR_REPOSITORY_URI}:latest" .

      - name: DockerRun smoke probe (container boot + health 200)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8501:8501 "${IMAGE_URI}"
          PROBE_OK=0
          for i in $(seq 1 45); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8501/_stcore/health || true)
            if [ "$CODE" = "200" ]; then echo "Container smoke probe OK (HTTP 200)"; PROBE_OK=1; break; fi
            sleep 2
          done
          docker logs smoke || true
          docker rm -f smoke || true
          if [ "$PROBE_OK" != "1" ]; then echo "Container smoke probe failed"; exit 1; fi

      - name: ECR login (direct AWS CLI, static credentials)
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories --region "$AWS_REGION" --repository-names sentiment-analysis-sih || \
          aws ecr create-repository --region "$AWS_REGION" --repository-name sentiment-analysis-sih

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "${IMAGE_URI}"
          docker push "${ECR_REPOSITORY_URI}:latest"

  deploy:
    name: Deploy to EC2 Docker via SSM
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSM send-command (docker pull + run on EC2)
        run: |
          set -euo pipefail
          IMAGE_URI="${{ needs.build.outputs.image_uri }}"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          cat > /tmp/ssm-params.json <<SSMPARAMS
          {
            "commands": [
              "set -euo pipefail",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:$CONTAINER_PORT --name app $IMAGE_URI",
              "docker image prune -f || true"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"
          echo "Sent SSM command: ${COMMAND_ID}"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command --command-id "$COMMAND_ID" --region "$AWS_REGION" --query "Command.Status" --output text)
            echo "SSM status: ${STATUS}"
            if [ "$STATUS" = "Success" ]; then echo "SSM deploy succeeded"; exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then break; fi
            sleep 10
          done
          echo "SSM command did not succeed; dumping output"
          aws ssm list-command-invocations --command-id "$COMMAND_ID" --region "$AWS_REGION" --details --query "CommandInvocations[0].CommandPlugins[0].Output" --output text || true
          exit 1

  verify:
    name: Post-deploy health verification
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          HEALTH_URL="${PUBLIC_URL}/_stcore/health"
          OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 5
          done
          if [ "$OK" != "1" ]; then echo "Health check failed: no HTTP 200 from ${HEALTH_URL}"; exit 1; fi
          BODY=$(curl -s "$HEALTH_URL" || true)
          echo "Health body: ${BODY}"
          echo "Deployment verified at ${PUBLIC_URL}"