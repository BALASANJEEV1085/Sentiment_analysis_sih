name: Build Deploy Verify Sentiment Analysis Streamlit

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/sentiment-analysis-sih
  EC2_INSTANCE_ID: i-02574bb763416d442
  CONTAINER_PORT: "8501"
  HOST_PORT: "80"
  PUBLIC_URL: http://43.204.71.54
  HEALTH_PATH: /_stcore/health
  SECRETS_MANAGER_ID: deptic/Sentiment_analysis_sih/secrets

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repository and requirements diagnostics
        run: |
          set -euo pipefail
          echo "--- repo tree ---"
          ls -la
          echo "--- src ---"
          ls -la src || true
          echo "--- models ---"
          ls -la models || true
          echo "--- requirements.txt ---"
          cat requirements.txt
          echo "--- entrypoint check ---"
          test -f app.py && echo "app.py present"
          test -f Dockerfile && echo "Dockerfile present"
          test -f models/sentiment_model.pkl && echo "sentiment_model.pkl present"
          grep -n "streamlit" requirements.txt || true
          grep -n "8501" Dockerfile || true
          python --version
          python -m pip --version

      - name: Validate Python source syntax
        run: |
          set -euo pipefail
          python -m py_compile app.py src/data_loader.py src/preprocessor.py src/trainer.py src/visuals.py
          echo "python syntax OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::6}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:${IMAGE_TAG}"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE=${LATEST_IMAGE}" >> "$GITHUB_ENV"

      - name: Authenticate Docker to ECR (direct AWS CLI, static credentials)
        run: |
          set -euo pipefail
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (repository Dockerfile, context .)
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t "$FULL_IMAGE" -t "$LATEST_IMAGE" .
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep "$ECR_REPOSITORY_URI" || true

      - name: Push Docker image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE"
          docker push "$LATEST_IMAGE"

  deploy:
    name: Deploy to EC2 via SSM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deployment image URI
        run: |
          set -euo pipefail
          IMAGE_URI="${{ needs.build.outputs.image_uri }}"
          if [ -z "$IMAGE_URI" ]; then
            IMAGE_URI="$ECR_REPOSITORY_URI:latest"
          fi
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          echo "Deploying image: ${IMAGE_URI}"

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/sentiment-analysis-sih:${IMAGE_TAG}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:8501 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/sentiment-analysis-sih:${IMAGE_TAG}",
              "docker ps --format '{{.Names}} {{.Status}}' | grep app || true",
              "docker image prune -f || true"
            ]
          }
          SSMPARAMS
          echo "--- ssm payload ---"
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          export IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          envsubst < /tmp/ssm-params.json > /tmp/ssm-params-resolved.json || true
          if [ -s /tmp/ssm-params-resolved.json ] && grep -q "${IMAGE_TAG}" /tmp/ssm-params-resolved.json; then
            PARAMS_FILE=/tmp/ssm-params-resolved.json
          else
            python3 - "$IMAGE_TAG" << 'PYEOF'
          import json, os
          tag = os.environ.get("IMAGE_TAG", "") or "latest"
          with open("/tmp/ssm-params.json") as f:
              data = json.load(f)
          data["commands"] = [c.replace("${IMAGE_TAG}", tag) for c in data["commands"]]
          with open("/tmp/ssm-params-resolved.json", "w") as f:
              json.dump(data, f, indent=2)
          PYEOF
            PARAMS_FILE=/tmp/ssm-params-resolved.json
          fi
          echo "--- resolved payload ---"
          cat "$PARAMS_FILE"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file://$PARAMS_FILE \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"
          echo "Sent SSM command: ${COMMAND_ID}"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 600 ))
          while true; do
            STATUS=$(aws ssm list-command-invocations \
              --instance-id "$EC2_INSTANCE_ID" \
              --command-id "$COMMAND_ID" \
              --query "CommandInvocations[0].Status" --output text)
            echo "SSM status: ${STATUS}"
            case "$STATUS" in
              Success) echo "SSM command succeeded"; break ;;
              Failed|Cancelled|TimedOut) echo "SSM command failed with status ${STATUS}"; exit 1 ;;
            esac
            if [ "$(date +%s)" -gt "$DEADLINE" ]; then
              echo "Timed out waiting for SSM command"; exit 1
            fi
            sleep 15
          done

      - name: Show SSM command output (deployment log)
        if: always()
        run: |
          set -euo pipefail
          aws ssm get-command-invocation \
            --instance-id "$EC2_INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json || true

  verify:
    name: Verify Public Health Endpoint
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for container startup
        run: |
          set -euo pipefail
          echo "Giving Streamlit container time to boot..."
          sleep 30

      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          HEALTH_URL="${PUBLIC_URL}${HEALTH_PATH}"
          echo "Probing ${HEALTH_URL}"
          ATTEMPTS=10
          for i in $(seq 1 $ATTEMPTS); do
            CODE=$(curl -s -o /tmp/health_body -w '%{http_code}' "$HEALTH_URL" || true)
            echo "Attempt ${i}/${ATTEMPTS}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "--- body ---"
              cat /tmp/health_body || true
              echo "HEALTH CHECK PASSED: HTTP 200 from ${HEALTH_URL}"
              exit 0
            fi
            sleep 15
          done
          echo "HEALTH CHECK FAILED: no HTTP 200 from ${HEALTH_URL} after ${ATTEMPTS} attempts"
          exit 1

      - name: Deployment summary
        run: |
          set -euo pipefail
          {
            echo "## Deployment Summary"
            echo "- Service: EC2_DOCKER (Streamlit sentiment analysis app)"
            echo "- Region: $AWS_REGION"
            echo "- ECR repo: $ECR_REPOSITORY_URI"
            echo "- Instance: $EC2_INSTANCE_ID"
            echo "- Container port: $CONTAINER_PORT, host port: $HOST_PORT"
            echo "- Public URL: $PUBLIC_URL"
            echo "- Status: verified healthy (HTTP 200)"
          } | tee -a "$GITHUB_STEP_SUMMARY"