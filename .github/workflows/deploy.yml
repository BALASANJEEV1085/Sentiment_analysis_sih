name: Build Deploy Verify Sentiment Analysis Streamlit

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/sentiment-analysis-sih
  EC2_INSTANCE_ID: i-02574bb763416d442
  CONTAINER_PORT: "8501"
  HOST_PORT: "80"
  PUBLIC_URL: http://43.204.71.54
  SECRETS_MANAGER_ID: deptic/Sentiment_analysis_sih/secrets

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Repository andrequirements diagnostics
        run: |
          set -euo pipefail
          echo "--- repo tree ---"
          ls -la
          echo "--- src ---"
          ls -la src || true
          echo "--- models ---"
          ls -la models || true
          echo "--- requirements.txt ---"
          cat requirements.txt
          echo "--- entrypoint check ---"
          test -f app.py && echo "app.py present"
          grep -n "streamlit" requirements.txt || true
          python --version
          python -m pip --version

      - name: Generate Dockerfile (repository has none; Streamlit app on port 8501)
        run: |
          set -euo pipefail
          cat > Dockerfile << 'DOCKERFILE'
          FROM python:3.10-slim

          ENV PYTHONUNBUFFERED=1 \
              PIP_NO_CACHE_DIR=1 \
              MPLBACKEND=Agg

          WORKDIR /app

          COPY requirements.txt ./
          RUN pip install -r requirements.txt

          RUN python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('stopwords', quiet=True); nltk.download('vader_lexicon', quiet=True)"

          COPY . .

          EXPOSE 8501

          HEALTHCHECK --interval=30s --timeout=10s --start-period=60s --retries=3 \
            CMD python -c "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)" || exit 1

          CMD ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
          DOCKERFILE
          echo "--- Dockerfile ---"
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::6}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:${IMAGE_TAG}"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE=${LATEST_IMAGE}" >> "$GITHUB_ENV"

      - name: Authenticate Docker to ECR (direct AWS CLI, static credentials)
        run: |
          set -euo pipefail
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context = repository root, per dockerfile_path '.')
        run: |
          set -euo pipefail
          docker build -t "$FULL_IMAGE" -t "$LATEST_IMAGE" -f Dockerfile .
          docker images | grep -E "sentiment-analysis-sih|REPOSITORY" || true

      - name: Build diagnostics - smoke test container import and Streamlit config
        run: |
          set -euo pipefail
          docker run --rm "$FULL_IMAGE" python -c "import streamlit, pandas, numpy, sklearn, nltk, wordcloud, matplotlib, altair; import src.data_loader, src.preprocessor, src.trainer, src.visuals; print('imports OK')"
          docker run --rm "$FULL_IMAGE" streamlit version || true
          docker inspect "$FULL_IMAGE" --format 'ExposedPorts: {{json .Config.ExposedPorts}}'

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE"
          docker push "$LATEST_IMAGE"

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy container on EC2 instance via SSM send-command
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          set -euo pipefail
          REGION="$AWS_REGION"
          INSTANCE_ID="$EC2_INSTANCE_ID"
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/sentiment-analysis-sih:${IMAGE_TAG}",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:8501 --name app $IMAGE_URI",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS
          sed -i "s|\${IMAGE_TAG}|${{ needs.build.outputs.image_tag }}|g" /tmp/ssm-params.json
          cat /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}"
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "attempt ${i}: status=${STATUS}"
            if [ "$STATUS" = "Success" ]; then
              echo "SSM command succeeded"
              break
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "SSM command failed with status ${STATUS}"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" || true
              exit 1
            fi
            sleep 10
          done
          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not reach Success in time (last: ${STATUS})"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" || true
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text || true

  verify:
    name: Verify public health endpoint
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL until HTTP 200
        run: |
          set -euo pipefail
          URL="$PUBLIC_URL"
          echo "Checking ${URL}"
          CODE=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/body.html -w "%{http_code}" "$URL" || true)
            echo "attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 500 /tmp/body.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed; last HTTP code: ${CODE}"
          exit 1

      - name: Assert Streamlit dashboard responded
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL")
          if [ "$CODE" != "200" ]; then
            echo "Final verification failed: HTTP ${CODE}"
            exit 1
          fi
          echo "Final verification OK: HTTP 200 from ${PUBLIC_URL}"