name: build-deploy-verify-sentiment-analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/sentiment-analysis-sih
  EC2_INSTANCE_ID: i-05a2563eed9aff4e0
  PUBLIC_URL: http://43.204.71.54
  CONTAINER_PORT: "8501"
  SECRETS_MANAGER_ID: deptic/Sentiment_analysis_sih/secrets

jobs:
  build:
    name: Build, Diagnostics and Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies from requirements.txt
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build diagnostics - compile all Python sources
        run: |
          set -euo pipefail
          python -m py_compile app.py src/data_loader.py src/preprocessor.py src/trainer.py src/visuals.py
          python -m compileall -q app.py src
          ls -la app.py requirements.txt Dockerfile models/sentiment_model.pkl src/

      - name: Build diagnostics - import smoke test (modules only)
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import importlib
          for mod in ("src.data_loader", "src.preprocessor", "src.trainer", "src.visuals"):
              importlib.import_module(mod)
              print("OK import", mod)
          from src.trainer import vader_sentiment_label, vader_sentiment_score
          print("VADER score:", vader_sentiment_score("I love this product"))
          print("VADER label:", vader_sentiment_label("this is terrible"))
          PYEOF

      - name: Build diagnostics - model artifact load check
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import pickle
          with open("models/sentiment_model.pkl", "rb") as f:
              pipe = pickle.load(f)
          print("Model loaded:", type(pipe))
          print("Steps:", [name for name, _ in pipe.steps])
          preds = pipe.predict(["I love it", "I hate it", "it is okay"])
          print("Sample predictions:", list(preds))
          PYEOF

      - name: Build diagnostics - streamlit headless boot probe
        run: |
          set -euo pipefail
          timeout 90 streamlit run app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 &
          SPID=$!
          BOOT_OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8501/_stcore/health || true)
            if [ "$CODE" = "200" ]; then echo "Streamlit boot probe OK (HTTP 200)"; BOOT_OK=1; break; fi
            sleep 2
          done
          kill $SPID 2>/dev/null || true
          wait $SPID 2>/dev/null || true
          if [ "$BOOT_OK" != "1" ]; then echo "Boot probe failed: no HTTP 200 from /_stcore/health"; exit 1; fi
          echo "Boot probe finished"

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          IMAGE_URI="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "IMAGE_URI=$IMAGE_URI"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login to ECR (direct AWS CLI, static credentials)
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build production image (multi-stage Dockerfile, context .)
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          docker build -f Dockerfile -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" -t "$ECR_REPOSITORY_URI:latest" .

      - name: Local container health probe (port 8501)
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          docker run -d --name local-probe -p 8501:8501 "$ECR_REPOSITORY_URI:$IMAGE_TAG"
          OK=0
          for i in $(seq 1 45); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8501/_stcore/health || true)
            if [ "$CODE" = "200" ]; then echo "Local container probe OK (HTTP 200)"; OK=1; break; fi
            sleep 2
          done
          docker logs local-probe || true
          docker rm -f local-probe || true
          if [ "$OK" != "1" ]; then echo "Local container probe failed"; exit 1; fi

      - name: Push image to ECR
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY_URI:latest"
          echo "Pushed $ECR_REPOSITORY_URI:$IMAGE_TAG and :latest"

  deploy:
    name: Deploy to EC2 Docker via SSM
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy image on EC2 via SSM send-command
        run: |
          set -euo pipefail
          IMAGE_URI="${{ needs.build.outputs.image_uri }}"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          cat > /tmp/ssm-params.json <<SSMPARAMS
          {
            "commands": [
              "set -euo pipefail",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:$CONTAINER_PORT $IMAGE_URI"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) echo "SSM deploy command succeeded"; break ;;
              InProgress|Pending|Delayed) sleep 5 ;;
              *) echo "SSM deploy command failed with status $STATUS"; exit 1 ;;
            esac
          done
          if [ "$STATUS" != "Success" ]; then echo "SSM command did not succeed in time"; exit 1; fi

      - name: Record deployment metadata
        run: |
          set -euo pipefail
          echo "instance_id=$EC2_INSTANCE_ID"
          echo "ecr_repo_url=$ECR_REPOSITORY_URI"
          echo "image_uri=${{ needs.build.outputs.image_uri }}"
          echo "public_url=$PUBLIC_URL"
          echo "security_group_id=sg-092b9d07aec65891d"
          echo "iam_instance_profile=sentiment-analysis-sih-instance-profile"
          echo "iam_role=sentiment-analysis-sih-ec2-role"
          echo "secrets_manager_id=$SECRETS_MANAGER_ID"

  verify:
    name: Verify public endpoint health
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for container startup on EC2
        run: sleep 20

      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 5
          done
          if [ "$OK" != "1" ]; then echo "Public health check failed: expected HTTP 200 from $PUBLIC_URL"; exit 1; fi
          echo "Public health check passed (HTTP 200) at $PUBLIC_URL"